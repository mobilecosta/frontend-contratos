<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="header-content">
      <h1>Frontend Contratos</h1>
      <div class="user-info" *ngIf="user">
        <span>{{ user.name }}</span>
        <button (click)="logout()" class="logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <nav class="dashboard-nav">
    <ul>
      <li><a routerLink="/clientes" routerLinkActive="active">Clientes</a></li>
      <li><a routerLink="/produtos" routerLinkActive="active">Produtos</a></li>
      <li><a routerLink="/contratos" routerLinkActive="active">Contratos</a></li>
    </ul>
  </nav>

  <main class="dashboard-content">
    <router-outlet></router-outlet>
  </main>
</div>
